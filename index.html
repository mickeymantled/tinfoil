<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080b08" />
    <meta name="color-scheme" content="dark" />

    <!--
      {{PLACEHOLDERS}} are filled in at build time from src/config.ts.
      __SITE_ORIGIN__ is filled in by the Express server on each request so
      social cards get absolute URLs on whatever domain the site is served from.
    -->
    <title>{{TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}" />
    <link rel="canonical" href="__SITE_ORIGIN____CANONICAL_PATH__" />

    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/png" href="/hats/tinfoil-hat.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="{{TOKEN_NAME}}" />
    <meta property="og:title" content="{{TITLE}}" />
    <meta property="og:description" content="{{DESCRIPTION}}" />
    <meta property="og:url" content="__SITE_ORIGIN____CANONICAL_PATH__" />
    <meta property="og:image" content="__SITE_ORIGIN__/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="{{TOKEN_NAME}} ({{TICKER}}): {{TAGLINE}}" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{TITLE}}" />
    <meta name="twitter:description" content="{{DESCRIPTION}}" />
    <meta name="twitter:image" content="__SITE_ORIGIN__/og.png" />
    <meta name="twitter:image:alt" content="{{TOKEN_NAME}} ({{TICKER}}): {{TAGLINE}}" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: monospace; color: #3dff7a; background: #080b08; padding: 2rem">
        {{TOKEN_NAME}} needs JavaScript to run. They would love it if you kept it off.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
